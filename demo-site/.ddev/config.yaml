# The components demo site of this repository: static pages, served by the web server of a DDEV
# project with no database, at http://bootstrap-steps-demo.ddev.site (the pages of version 4.6 at
# /4.6/). `ddev start` in this folder starts it, `ddev stop` stops it, `ddev delete -Oy` removes it.
name: bootstrap-steps-demo
type: php
docroot: .
php_version: "8.3"
webserver_type: nginx-fpm
omit_containers: [db]
nodejs_version: "24"
